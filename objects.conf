# Salesforce objects synced by run.sh, one per line:
#   <Salesforce object>   <Snowflake table>   [delete mode: off|flag|remove]
# The delete mode defaults to DELETE_MODE in project.env.
# Each object's fields come from queries/<Object>.soql, which `./run.sh schema`
# generates (every field) if it doesn't exist. Edit it to trim the field list.
# Reserved words (ACCOUNT, ORDER) work as table names; they're quoted in SQL.
Account              ACCOUNT
Campaign             CAMPAIGN
Financial_Batch__c   FINANCIAL_BATCH__C
GiftTransaction      GIFT_TRANSACTION
GiftTransactionDesignation      GIFT_TRANSACTION_DESIGNATION
Order                ORDER
Subscription__c      SUBSCRIPTION
Transaction__c       TRANSACTION__C
ContactPointAddress  CONTACT_POINT_ADDRESS
Campaign_Product__c   CAMPAIGN_PRODUCT__C
ContactPointEmail    CONTACT_POINT_EMAIL
ContactPointPhone    CONTACT_POINT_PHONE
OrderItem          ORDER_ITEM
Merge_Child__c        MERGE_CHILD__C